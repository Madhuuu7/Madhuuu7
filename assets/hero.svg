  <style>
    .petal { opacity: 0; animation-name: fall; animation-timing-function: linear;
              animation-iteration-count: infinite; }
    @keyframes fall {
      0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
      8%   { opacity: .85; }
      85%  { opacity: .7; }
      100% { opacity: 0; transform: translate(var(--drift), 292px) rotate(300deg); }
    }
    .reveal { transform-origin: 270.0px 0; animation: type 11s steps(53, end) infinite; }
    @keyframes type {
      0%, 4%    { transform: scaleX(0); }
      38%, 94%  { transform: scaleX(1); }
      100%      { transform: scaleX(0); }
    }
    .caret { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .rule { transform-origin: 500.0px 0; animation: draw 11s ease-out infinite; }
    @keyframes draw { 0% { transform: scaleX(0); } 9%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .petal, .reveal, .caret, .rule { animation: none; }
    }
  </style>
