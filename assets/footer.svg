    <clipPath id="garden"><rect width="1000" height="178" rx="14"/></clipPath>
  </defs>
  <style>
    .run { animation: run 14s linear infinite; }
    @keyframes run { from { transform: translateX(-100px); } to { transform: translateX(980px); } }
    .hop { animation: hop 14s linear infinite; }
    @keyframes hop { 0% { transform: translateY(0); } 8.8% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 12.2% { transform: translateY(-38px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 15.6% { transform: translateY(0); } 19.2% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 22.6% { transform: translateY(-38px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 26.0% { transform: translateY(0); } 73.3% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 76.7% { transform: translateY(-38px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 80.1% { transform: translateY(0); } 83.6% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 87.0% { transform: translateY(-38px); animation-timing-function: cubic-bezier(.6,0,.8,.3); } 90.4% { transform: translateY(0); } 100% { transform: translateY(0); } }
    .la { animation: step .28s steps(1, end) infinite; }
    .lb { opacity: 0; animation: step .28s steps(1, end) -.14s infinite; }
    @keyframes step { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .run, .hop, .la, .lb { animation: none; }
    }
  </style>
