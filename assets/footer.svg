<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Thanks for visiting my little garden">
  <title>Thanks for visiting my little garden</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#F5E6EE"/>
      <stop offset="0.55" stop-color="#FFFDFB"/>
      <stop offset="1" stop-color="#F5E6EE"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C890A6"/>
      <stop offset="1" stop-color="#E0BAC6"/>
    </linearGradient>
    <g id="petal">
      <circle cx="0" cy="-4.4" r="3.6"/>
      <circle cx="4.2" cy="-1.3" r="3.6"/>
      <circle cx="2.6" cy="3.5" r="3.6"/>
      <circle cx="-2.6" cy="3.5" r="3.6"/>
      <circle cx="-4.2" cy="-1.3" r="3.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFDFB"/>
    </g>
  </defs>

  <rect width="1000" height="130" rx="14" fill="url(#dusk)"/>
  <rect width="1000" height="130" rx="14" fill="none" stroke="#E0BAC6" stroke-width="2"/>

  <path d="M -10 104 C 150 84, 300 116, 460 96" fill="none" stroke="#E0BAC6" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 1010 104 C 850 84, 700 116, 540 96" fill="none" stroke="#E0BAC6" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

  <g fill="#C890A6">
    <use href="#petal" transform="translate(96 92)" opacity="0.85"/>
    <use href="#petal" transform="translate(208 102) scale(0.8)" opacity="0.65"/>
    <use href="#petal" transform="translate(330 110) scale(0.9)" opacity="0.5"/>
    <use href="#petal" transform="translate(904 92)" opacity="0.85"/>
    <use href="#petal" transform="translate(792 102) scale(0.8)" opacity="0.65"/>
    <use href="#petal" transform="translate(670 110) scale(0.9)" opacity="0.5"/>
  </g>
  <g fill="#E0BAC6">
    <use href="#petal" transform="translate(150 34) scale(0.7)" opacity="0.5"/>
    <use href="#petal" transform="translate(858 30) scale(0.7)" opacity="0.5"/>
  </g>

  <text x="500" y="56" text-anchor="middle" fill="#574A50"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="21">Thanks for visiting my little garden</text>

  <rect x="446" y="70" width="108" height="2.5" rx="1.25" fill="url(#ribbon2)"/>

  <text x="500" y="98" text-anchor="middle" fill="#C890A6"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="13">open a console, then read what it says it cannot show you</text>
</svg>
