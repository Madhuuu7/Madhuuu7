# Redraw the contribution graph as a snake eating it.
#
# The generated SVGs are pushed to an `output` branch of this repository and
# the README points at raw.githubusercontent.com, so what a visitor loads is
# served by GitHub from this repo rather than by a third-party card service.
# That matters here: the profile was built after the card service most
# profiles use spent a week answering DEPLOYMENT_PAUSED, which leaves a
# broken image in the middle of the page it was supposed to decorate. This
# way a bad day for the action means the snake is a few hours stale, not
# missing.
#
# Colours are the profile's own: blossom through to dusty rose for the
# squares, dusty rose for the snake, so it sits in the page instead of
# arriving from somebody else's palette.

name: snake

on:
  schedule:
    # twice a day; the graph does not change faster than that
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C890A6&color_dots=#F5E6EE,#F0DEE6,#E0BAC6,#C890A6,#A9718A
            dist/github-snake-dark.svg?color_snake=#E0BAC6&color_dots=#2A1B22,#553944,#87596B,#B07D91,#E0BAC6

      - name: Push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
